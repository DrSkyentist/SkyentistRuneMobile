name: SkyRune iPadOS Plugin Profile Trace

on:
  push:
    branches: [diagnostic/plugin-profile-trace]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipados:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      IOS_ADHOC: "1"
      PLATFORMS: ios
      IOS_JRE_SHA256: 421ce7afad50355cc4a92ac89cd655bd7e384784429de3472b3150988a583706
    steps:
      - name: Checkout fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up build environment
        run: |
          echo "BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + 1000 ))" >> "$GITHUB_ENV"
          echo "CI_CONFIG_DIR=$RUNNER_TEMP/runemobile-ci" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK for shared Gradle tooling
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fetch verified iOS JRE from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_CONFIG_DIR/ios-jre"
          gh release download ios-jre-dep --repo audaro/RuneMobile --pattern 'jre.tar.gz' --output "$RUNNER_TEMP/jre.tar.gz"
          echo "$IOS_JRE_SHA256  $RUNNER_TEMP/jre.tar.gz" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/jre.tar.gz" -C "$CI_CONFIG_DIR/ios-jre" --strip-components=1

      - name: Build iPadOS IPA only
        run: |
          export GIT_SHA="$(git rev-parse --short HEAD)"
          tools/ci/build-release-artifacts.sh

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SkyRune-Plugin-Profile-Diagnostics-IPA
          path: dist/ci/*.ipa
          if-no-files-found: error
          retention-days: 14
